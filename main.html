<main class="content" id="page"><div class="loading-screen"><div style="text-align:center"><div class="loader"></div><strong>Menghubungkan EduTask…</strong><p class="muted" style="margin-top:9px">Memeriksa sesi secara aman</p></div></div></main></div></div>
<div class="modal-overlay" id="overlay" aria-hidden="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><span class="hint" id="modalLabel">EDUTASK WORKSPACE</span><h2 id="modalTitle">Detail</h2><p id="modalDesc">Kelola data Anda dengan aman.</p></div><button class="close" id="modalClose" aria-label="Tutup dialog">×</button></div><div class="modal-body" id="modalBody"></div></div></div><div id="toasts" class="toast-area" aria-live="polite"></div>
<script src="config.js"></script>
<script>
(() => {
'use strict';
const E=window.Edutask,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s===null||s===undefined?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nice=s=>String(s||'').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\b\w/g,c=>c.toUpperCase());
const date=s=>{if(!s)return '—';const v=new Date(s.length===10?s+'T12:00:00':s);return Number.isNaN(v.getTime())?s:v.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});};
const num=n=>Number(n||0).toLocaleString('id-ID');
const initials=s=>String(s||'ED').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
const fmt=s=>String(s||'').slice(0,10);
const icon={overview:'◈',tasks:'☷',calendar:'▦',daily:'▤',progress:'◴',feedback:'↻',projects:'⬡',development:'✦',notifications:'♢',announcements:'◉',performance:'◧',profile:'◍',interns:'♙',mentors:'♧',teams:'♧',monitoring:'◎',reviews:'✓',analytics:'▥',batches:'▣',evaluations:'★',reports:'↧',audit:'⌁',templates:'▧',settings:'⚙',programs:'▥',criteria:'☰',milestones:'◇',members:'♧',mentorships:'♙'};
const NAV_INTERN=[['WORKSPACE',['overview','tasks','calendar','daily']],['GROWTH & COLLABORATION',['progress','feedback','projects','development']],['YOUR ACCOUNT',['notifications','announcements','performance','profile']]];
const NAV_STAFF=[['COMMAND CENTER',['overview','tasks','monitoring','reviews']],['PEOPLE & PROJECTS',['interns','mentors','teams','projects','batches','calendar','daily']],['INTELLIGENCE',['analytics','evaluations','reports','announcements','notifications','audit']],['ADMINISTRATION',['templates','settings','programs','criteria','milestones','members','mentorships','profile']]];
const TITLES={overview:'Overview',tasks:'Task Management',calendar:'My Calendar',daily:'Daily Activity Log',progress:'My Progress',feedback:'Feedback & Revisions',projects:'Projects & Milestones',development:'Personal Development',notifications:'Notifications',announcements:'Announcements',performance:'My Performance',profile:'My Profile',interns:'Intern Management',mentors:'Mentor Management',teams:'Team Management',monitoring:'Task Monitoring',reviews:'Submission Review',analytics:'Performance Analytics',batches:'Internship Batches',evaluations:'Evaluation & Scoring',reports:'Reports & Export',audit:'Activity & Audit Log',templates:'Task Templates',settings:'Settings & Administration',programs:'Internship Programs',criteria:'Evaluation Criteria',milestones:'Project Milestones',members:'Project Members',mentorships:'Mentor Assignments'};
const TABLE={daily:'DailyReports',projects:'Projects',development:'InternProfiles',announcements:'Announcements',batches:'Batches',teams:'Teams',audit:'AuditLogs',templates:'TaskTemplates',settings:'AppSettings',programs:'InternshipPrograms',criteria:'EvaluationCriteria',milestones:'Milestones',members:'ProjectMembers',mentorships:'MentorAssignments'};
const FIELDS={
 DailyReports:[['date','Tanggal','date'],['type','Jenis laporan','select:Check-In|Half-Day Check|Check-Out'],['goal',"Today's goal",'textarea'],['priorities','Prioritas hari ini','textarea'],['completed','Pekerjaan selesai','textarea'],['inProgress','Sedang dikerjakan','textarea'],['blockers','Blockers','textarea'],['learnings','Pembelajaran','textarea'],['tomorrow','Rencana besok','textarea'],['durationMinutes','Durasi kerja (menit)','number']],
 Projects:[['name','Nama proyek','text',true],['description','Deskripsi','textarea'],['mentorId','Mentor / PIC','user'],['batchId','Batch','ref:Batches'],['programId','Program','ref:InternshipPrograms'],['startDate','Tanggal mulai','date'],['dueDate','Deadline','date'],['priority','Prioritas','select:Low|Medium|High|Urgent'],['progress','Progres (%)','number']],
 InternProfiles:[['userId','Peserta','user'],['bio','Tentang peserta','textarea'],['objectives','Tujuan internship','textarea'],['learningGoals','Learning goals','textarea'],['skills','Skill development','textarea'],['achievements','Achievements','textarea'],['linkedin','LinkedIn URL','url'],['github','GitHub URL','url']],
 Announcements:[['title','Judul pengumuman','text',true],['content','Isi pengumuman','textarea',true],['audience','Audiens','select:all|intern|mentor|admin'],['batchId','Batch (opsional)','ref:Batches'],['publishAt','Tanggal publikasi','date']],
 Batches:[['name','Nama batch','text',true],['description','Deskripsi','textarea'],['programId','Program','ref:InternshipPrograms'],['mentorId','Mentor penanggung jawab','user'],['startDate','Mulai','date'],['endDate','Selesai','date']],
 Teams:[['name','Nama tim','text',true],['description','Deskripsi','textarea'],['batchId','Batch','ref:Batches'],['mentorId','Mentor','user']],
 TaskTemplates:[['title','Judul template','text',true],['description','Deskripsi','textarea'],['instructions','Instruksi','textarea'],['category','Kategori'],['priority','Prioritas','select:Low|Medium|High|Urgent'],['estimateHours','Estimasi jam','number'],['checklist','Checklist (satu per baris)','textarea']],
 InternshipPrograms:[['name','Nama program','text',true],['description','Deskripsi','textarea'],['startDate','Mulai','date'],['endDate','Selesai','date']],
 EvaluationCriteria:[['name','Kriteria','text',true],['weight','Bobot','number'],['description','Deskripsi','textarea']],
 Milestones:[['name','Nama milestone','text',true],['description','Deskripsi','textarea'],['projectId','Proyek','ref:Projects',true],['dueDate','Deadline','date'],['progress','Progres (%)','number']],
 ProjectMembers:[['projectId','Proyek','ref:Projects',true],['userId','Anggota','user',true]],
 MentorAssignments:[['mentorId','Mentor','user',true],['internId','Peserta','user',true],['projectId','Proyek opsional','ref:Projects']],
 AppSettings:[['key','Nama pengaturan','text',true],['value','Nilai','textarea',true]]
};
const state={user:null,role:'intern',route:'overview',dashboard:null,items:[],cache:new Map(),userMap:new Map(),search:'',status:'',sort:'newest',view:'table',page:1,calDate:new Date(),calView:'month',loading:false,detail:null};
const isStaff=()=>state.role==='admin'||state.role==='mentor',isAdmin=()=>state.role==='admin';
function toast(message,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=message;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),4700);}
function badge(status){const map={'To Do':'gray','In Progress':'blue','In Review':'purple','Revision Required':'warning','Completed':'','Blocked':'danger','Active':'','Archived':'gray','High':'warning','Urgent':'urgent','Low':'gray','Medium':'blue','Approved':'','true':'','false':'gray'};return `<span class="badge ${map[String(status)]||''}">${esc(status||'—')}</span>`;}
function title(route){return TITLES[route]||nice(route);}
function showModal(heading,body,label='EDUTASK WORKSPACE',desc='Kelola informasi secara aman.'){ $('#modalTitle').textContent=heading;$('#modalLabel').textContent=label;$('#modalDesc').textContent=desc;$('#modalBody').innerHTML=body;$('#overlay').classList.add('show');$('#overlay').setAttribute('aria-hidden','false');$('#modalClose').focus();}
function closeModal(){$('#overlay').classList.remove('show');$('#overlay').setAttribute('aria-hidden','true');$('#modalBody').innerHTML='';state.detail=null;}
function side(open){$('#sidebar').classList.toggle('open',open);$('#shade').classList.toggle('show',open);}
function nav(){const menus=isStaff()?NAV_STAFF:NAV_INTERN;$('#navigation').innerHTML=menus.map(([group,items])=>`<div class="menu-group">${esc(group)}</div>`+items.filter(route=>isAdmin()||!['settings','programs','criteria','members','mentorships','mentors','audit'].includes(route)).map(route=>`<button class="nav-item ${state.route===route?'active':''}" data-route="${route}"><span class="nav-icon">${icon[route]||'◈'}</span><span>${esc(title(route))}</span>${route==='notifications'&&state.dashboard?.notifications?.some(n=>n.isRead!=='true')?'<i class="indicator"></i>':''}</button>`).join('')).join('');
$('#workspaceTitle').textContent=isStaff()?'Mentor Command Center':'Intern Workspace';$('#workspaceRole').textContent=state.role==='admin'?'Admin & Organization':state.role==='mentor'?'Mentor & Supervisor':'Intern Operations';$('#sideName').textContent=state.user.fullName;$('#sideRole').textContent=nice(state.role);$('#sideAvatar').textContent=initials(state.user.fullName);$('#topAvatar').textContent=initials(state.user.fullName);$('#notiDot').style.display=state.dashboard?.notifications?.some(n=>n.isRead!=='true')?'block':'none';}
const descRoute=route=>({overview:'Ringkasan pekerjaan, prioritas, dan aktivitas terbaru.',tasks:'Kerjakan, kelola, dan pantau penugasan dalam satu ruang kerja.',monitoring:'Pantau beban kerja dan status seluruh peserta yang Anda kelola.',reviews:'Review submission, berikan revisi atau approval.',analytics:'Analisis progres dan performa dengan metrik yang transparan.',daily:'Dokumentasikan pekerjaan harian dan perkembangan.',calendar:'Pantau jadwal dan tenggat aktivitas.',reports:'Ekspor data aktual sesuai kewenangan akun Anda.'}[route]||`Kelola ${title(route).toLowerCase()} yang terhubung dengan database.`);
function heading(extra=''){return `<div class="heading"><div><div class="hint">${isStaff()?'MENTOR COMMAND CENTER':'INTERN WORKSPACE'} / ${esc(title(state.route).toUpperCase())}</div><h1>${esc(title(state.route))}</h1><p>${esc(descRoute(state.route))}</p></div><div class="actions">${extra}<button class="btn" data-action="refresh">↻ Refresh</button></div></div>`;}
function empty(titleText='Belum ada data',msg='Data akan muncul ketika tersedia di database.') {return `<div class="empty"><div class="em-icon">✦</div><h3>${esc(titleText)}</h3><p>${esc(msg)}</p></div>`;}
function stat(label,value,sub,ico){return `<div class="card stat"><span class="small-label">${esc(label)}</span><div class="stat-icon">${ico}</div><strong>${esc(value)}</strong><div class="stat-sub">${esc(sub||'EduTask Operations')}</div></div>`;}
function renderDashboard(){const d=state.dashboard;if(!d){$('#page').innerHTML=heading()+empty('Memuat dashboard','Tidak ada snapshot yang tersedia.');return;}
const s=d.stats,staff=isStaff(),heroText=staff?'Semua tugas. Satu pusat kendali.':'Setiap progres adalah pencapaian.',heroSub=staff?'Kelola peserta magang, tinjau hasil pekerjaan, dan pastikan setiap milestone tercapai bersama.':'Jelajahi tugas prioritas, atur progres, dan maksimalkan pembelajaran setiap hari.';
const line=(d.weekly||[]).map((v,i)=>{const max=Math.max(1,...d.weekly.map(x=>x.count));return `<div class="barcol"><small>${v.count}</small><div class="bar" style="height:${Math.max(5,Math.round(v.count/max*118))}px" title="${v.count} tugas selesai"></div><span>${new Date(v.date+'T12:00:00').toLocaleDateString('id-ID',{weekday:'short'})}</span></div>`}).join('');
$('#page').innerHTML=`<section class="hero"><div class="hero-inner"><div class="hero-label">✦ &nbsp; SMARTER TASKS. BETTER GROWTH.</div><h2>${esc(heroText)}</h2><p>Halo, <strong>${esc(state.user.fullName.split(' ')[0])}</strong>! ${esc(heroSub)}</p><button class="hero-btn" data-route="${staff?'reviews':'tasks'}">${staff?'Lihat pending review':'Jelajahi tugas saya'} &nbsp; →</button></div></section>
<div class="stats">${stat(staff?'Total Assignment':'Tugas Saya',num(s.total),staff?`${d.interns} peserta dikelola`:'Semua penugasan','▥')}${stat('Sedang Dikerjakan',num(s.inProgress),'In Progress','◴')}${stat('Menunggu Review',num(s.inReview),'Submission pending','◉')}${stat('Tingkat Penyelesaian',s.completionRate+'%',`${s.completed} tugas selesai`,'✓')}</div>
<div class="dashboard-grid"><div><section class="card card-pad"><div class="section-head"><h3 class="section-title">Weekly Completion <small>7 hari terakhir</small></h3>${badge(s.completed+' completed')}</div><div class="linechart">${line}</div></section><section class="card card-pad" style="margin-top:18px"><div class="section-head"><h3 class="section-title">Prioritas & Deadline <small>${d.earliest.length} terdekat</small></h3><button class="btn small" data-route="tasks">Semua tugas →</button></div>${d.earliest.length?d.earliest.map(t=>`<div class="mini-row"><div class="mini-icon">◷</div><div class="grow"><strong>${esc(t.title)}</strong><small>Deadline ${date(t.dueDate)} · ${t.progress}% progress</small></div>${t.isOverdue?badge('Overdue'):badge(t.taskStatus)}<button class="btn small" data-task="${esc(t.assignmentId)}">Lihat</button></div>`).join(''):empty('Tidak ada deadline mendekat','Tugas dengan deadline akan ditampilkan di sini.')}</section></div>
<div><section class="card card-pad"><div class="section-head"><h3 class="section-title">Task Distribution</h3><small class="muted">${s.total} penugasan</small></div>${[['Completed',s.completed],['In Progress',s.inProgress],['In Review',s.inReview],['To Do',s.todo],['Revision',s.revision],['Overdue',s.overdue]].map(([name,v])=>`<div style="margin:18px 0"><div style="display:flex;justify-content:space-between;gap:9px;margin-bottom:8px;font-size:10px;font-weight:800"><span>${name}</span><span>${v}</span></div><div class="progress-track"><div class="fill" style="width:${s.total?Math.round(v/s.total*100):0}%"></div></div></div>`).join('')}</section><section class="card card-pad" style="margin-top:18px"><div class="section-head"><h3 class="section-title">Latest Activity</h3><button class="btn small" data-route="notifications">Notifikasi</button></div>${d.activities.length?d.activities.slice(0,5).map(a=>`<div class="activity-item"><i></i><div><b>${esc(nice(a.action))}</b><small>${esc(a.details||'Progress diperbarui')} · ${date(a.createdAt)}</small></div></div>`).join(''):empty('Belum ada aktivitas','Perubahan tugas akan terekam secara otomatis.')}</section></div></div>`;
}
function userName(id){const u=state.userMap.get(id);return u?u.fullName:(id===state.user.id?state.user.fullName:id||'—');}
function taskFiltered(){let rows=state.items.slice();if(state.route==='reviews')rows=rows.filter(r=>r.taskStatus==='In Review');if(state.route==='feedback')rows=rows.filter(r=>['Revision Required','In Review','Completed'].includes(r.taskStatus));
if(state.status)rows=rows.filter(r=>state.status==='Overdue'?r.isOverdue:r.taskStatus===state.status);
if(state.search){const q=state.search.toLowerCase();rows=rows.filter(r=>[r.title,r.category,r.projectId,r.description,userName(r.internId)].some(x=>String(x||'').toLowerCase().includes(q)));}
if(state.sort==='due')rows.sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));else if(state.sort==='priority'){const rank={Urgent:0,High:1,Medium:2,Low:3};rows.sort((a,b)=>(rank[a.priority]??9)-(rank[b.priority]??9));}else rows.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return rows;}
function taskToolbar(){return `<div class="toolbar"><div class="filters"><input class="input search" id="search" placeholder="⌕ &nbsp; Cari tugas atau peserta…" value="${esc(state.search)}" aria-label="Cari tugas"><select class="select" id="statusFilter"><option value="">Semua status</option>${['To Do','In Progress','In Review','Revision Required','Completed','Blocked','Overdue'].map(s=>`<option value="${esc(s)}" ${state.status===s?'selected':''}>${s}</option>`).join('')}</select><select class="select" id="sortFilter"><option value="newest" ${state.sort==='newest'?'selected':''}>Terbaru</option><option value="due" ${state.sort==='due'?'selected':''}>Deadline</option><option value="priority" ${state.sort==='priority'?'selected':''}>Prioritas</option></select></div><div class="segment">${['table','kanban'].map(v=>`<button data-view="${v}" class="${state.view===v?'selected':''}">${v==='table'?'▤ Table':'▦ Board'}</button>`).join('')}</div></div>`;}
function renderTasks(){const rows=taskFiltered(),staff=isStaff(),create=staff?'<button class="btn primary" data-action="newTask">＋ Buat tugas</button>':'';
const pill=state.route==='reviews'?'<span class="badge purple">Pending Review</span>':'';
const table=`<div class="table-wrap"><table class="data-table"><thead><tr><th>Task & Project</th>${staff?'<th>Assigned To</th>':''}<th>Priority</th><th>Progress</th><th>Status</th><th>Deadline</th><th style="text-align:right">Action</th></tr></thead><tbody>${rows.slice((state.page-1)*20,state.page*20).map(t=>`<tr><td class="title-cell">${esc(t.title)}<span class="tiny">${esc(t.category||'General')} · #${esc(t.assignmentId.slice(-7))}</span></td>${staff?`<td>${esc(userName(t.internId))}</td>`:''}<td>${badge(t.priority||'Medium')}</td><td><div class="progress-track" style="width:85px"><div class="fill" style="width:${Number(t.progress)||0}%"></div></div><span class="tiny">${t.progress||0}%</span></td><td>${badge(t.taskStatus)}${t.isOverdue?'<span class="tiny" style="color:#d75855">Overdue</span>':''}</td><td>${esc(date(t.dueDate))}</td><td><div class="row-actions"><button class="btn small" data-task="${esc(t.assignmentId)}">Detail →</button>${staff?`<button class="btn small" data-edit-task="${esc(t.id)}" title="Edit tugas">✎</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`;
const board=`<div class="kanban">${['To Do','In Progress','In Review','Revision Required','Completed','Blocked'].map(status=>{const each=rows.filter(r=>r.taskStatus===status);return `<section class="kan-col"><div class="kan-head"><span>${esc(status)}</span>${badge(each.length)}</div>${each.map(t=>`<div class="task-card"><div style="display:flex;justify-content:space-between;gap:8px">${badge(t.priority||'Medium')}${t.isOverdue?badge('Overdue'):''}</div><h4>${esc(t.title)}</h4>${staff?`<small>◍ ${esc(userName(t.internId))}</small>`:''}<div class="progress-track" style="margin-top:13px"><div class="fill" style="width:${t.progress||0}%"></div></div><div class="row-mini"><small>◷ ${date(t.dueDate)}</small><button data-task="${esc(t.assignmentId)}">Detail →</button></div></div>`).join('')||'<p class="muted" style="font-size:10px;text-align:center;padding:20px">Tidak ada tugas</p>'}</section>`;}).join('')}</div>`;
$('#page').innerHTML=heading(create)+`<div class="card card-pad">${pill?`<p style="margin-bottom:12px">${pill} <small class="muted">${rows.length} pekerjaan menunggu evaluasi</small></p>`:''}${taskToolbar()}${rows.length?(state.view==='kanban'?board:table):empty('Tidak ada tugas sesuai filter','Coba ubah filter atau buat penugasan baru.')}${state.view==='table'&&rows.length?pagination(rows.length):''}</div>`;}
function pagination(count){const max=Math.max(1,Math.ceil(count/20));return `<div class="pagination"><span>Menampilkan ${Math.min((state.page-1)*20+1,count)}–${Math.min(state.page*20,count)} dari ${count} record</span><div class="actions"><button class="btn small" data-page="${state.page-1}" ${state.page===1?'disabled':''}>← Sebelumnya</button><span>Halaman ${state.page}/${max}</span><button class="btn small" data-page="${state.page+1}" ${state.page===max?'disabled':''}>Selanjutnya →</button></div></div>`;}
function recordSearch(rows){let filtered=rows;if(state.search){const q=state.search.toLowerCase();filtered=filtered.filter(row=>Object.values(row).some(v=>String(v??'').toLowerCase().includes(q)));}
const updated=(a,b)=>(b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||'');return filtered.sort(updated);}
function canCreate(route){if(route==='daily')return state.role==='intern';if(route==='development')return true;return isStaff() && (isAdmin() || !['programs','criteria','settings','members','mentorships','teams','batches'].includes(route));}
function renderGeneric(){const route=state.route,table=TABLE[route],rows=recordSearch(state.items.slice()),columns=FIELDS[table]||[],create=canCreate(route)?`<button class="btn primary" data-add="${table}">＋ ${route==='daily'?'Buat daily report':'Tambah '+title(route)}</button>`:'';
const toolbar=`<div class="toolbar"><input class="input search" id="search" value="${esc(state.search)}" placeholder="⌕ &nbsp; Cari ${esc(title(route).toLowerCase())}…"><span class="muted" style="font-size:10px">${rows.length} data</span></div>`;
if(['projects','announcements','templates'].includes(route)){
 $('#page').innerHTML=heading(create)+toolbar+(rows.length?`<div class="record-grid">${rows.slice((state.page-1)*20,state.page*20).map(r=>`<article class="card record-card"><div class="section-head" style="margin:0">${badge(r.priority||r.audience||r.status)}<small class="muted">${esc(date(r.createdAt))}</small></div><h3>${esc(r.name||r.title||'Data')}</h3><p>${esc((r.description||r.content||'Belum ada deskripsi.').slice(0,190))}</p><footer><small class="muted">${esc(r.dueDate?`Due ${date(r.dueDate)}`:r.category||'EduTask')}</small><span class="actions"><button class="btn small" data-record-detail="${esc(table)}:${esc(r.id)}">Detail</button>${canCreate(route)?`<button class="btn small" data-edit="${esc(table)}:${esc(r.id)}">✎</button>`:''}</span></footer></article>`).join('')}</div>${pagination(rows.length)}`:empty());return;
}
const cols=columns.length?columns.filter(([k])=>!['description','content','notes','checklist','objectives','learningGoals','skills','achievements','learnings','tomorrow','blockers','priorities','completed','inProgress','goal'].includes(k)).slice(0,4).map(([k,label])=>[k,label]):[
 ['entity','Entitas'],['action','Aktivitas'],['actorId','Aktor'],['createdAt','Waktu']];
if(route==='daily')cols.splice(0,cols.length,['date','Tanggal'],['type','Jenis'],['goal','Tujuan'],['completed','Selesai']);
if(route==='development')cols.splice(0,cols.length,['userId','Peserta'],['objectives','Tujuan'],['skills','Skill'],['updatedAt','Diperbarui']);
const tableHTML=`<div class="card card-pad">${toolbar}${rows.length?`<div class="table-wrap"><table class="data-table"><thead><tr>${cols.map(([,label])=>`<th>${esc(label)}</th>`).join('')}<th style="text-align:right">Actions</th></tr></thead><tbody>${rows.slice((state.page-1)*20,state.page*20).map(row=>`<tr>${cols.map(([k])=>{let v=row[k];if(/Id$/.test(k)&&k==='userId'||k==='mentorId'||k==='internId')v=userName(v);return `<td>${esc(String(v||'—').slice(0,115))}</td>`;}).join('')}<td><div class="row-actions"><button class="btn small" data-record-detail="${esc(table)}:${esc(row.id)}">Detail</button>${canCreate(route)?`<button class="btn small" data-edit="${esc(table)}:${esc(row.id)}">✎</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>${pagination(rows.length)}`:empty()}</div>`;
$('#page').innerHTML=heading(create)+tableHTML;
}
function renderPeople(){const rows=recordSearch(state.items.filter(x=>x.role===(state.route==='mentors'?'mentor':'intern')));
const create=isAdmin()?'<button class="btn primary" data-action="invite">✉ Undang pengguna</button>':'';

function renderCalendar(){const today=state.calDate,y=today.getFullYear(),m=today.getMonth(),first=new Date(y,m,1).getDay(),offset=(first+6)%7;
const start=new Date(y,m,1-offset),current=new Date(), tasks=state.items.filter(t=>t.dueDate);
const select=`<div class="actions"><button class="btn small" data-cal-prev="1">←</button><strong>${today.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</strong><button class="btn small" data-cal-next="1">→</button><button class="btn small" data-cal-today="1">Hari ini</button><div class="segment">${['month','week','agenda'].map(x=>`<button class="${state.calView===x?'selected':''}" data-cal-view="${x}">${x==='month'?'Bulan':x==='week'?'Pekan':'Agenda'}</button>`).join('')}</div></div>`;

if(state.calView==='agenda'){body=tasks.sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).filter(t=>t.dueDate>=fmt(new Date())).slice(0,40).map(t=>`<div class="mini-row"><div class="mini-icon">◷</div><div class="grow"><strong>${esc(t.title)}</strong><small>${date(t.dueDate)}</small></div>${badge(t.taskStatus)}<button class="btn small" data-task="${t.assignmentId}">Buka</button></div>`).join('')||empty('Tidak ada agenda','Deadline akan tampil setelah mentor membuat tugas.');}
else{let count=state.calView==='week'?7:42,dates=[];
if(state.calView==='week'){const currentDay=new Date(y,m,state.calDate.getDate()),dayOffset=(currentDay.getDay()+6)%7;currentDay.setDate(currentDay.getDate()-dayOffset);for(let i=0;i<7;i++){const d=new Date(currentDay);d.setDate(d.getDate()+i);dates.push(d);}}else for(let i=0;i<count;i++){const d=new Date(start);d.setDate(d.getDate()+i);dates.push(d);}
body=`<div class="cal-grid">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<div class="cal-weekhead">${d}</div>`).join('')}${dates.map(d=>{const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,list=tasks.filter(t=>t.dueDate===k).slice(0,3);return `<div class="cal-day ${d.getMonth()!==m?'other':''} ${k===fmt(current)?'today':''}"><div class="daynum">${d.getDate()}</div>${list.map(t=>`<button class="cal-event ${t.isOverdue?'late':''}" data-task="${esc(t.assignmentId)}" title="${esc(t.title)}">${esc(t.title)}</button>`).join('')}${tasks.filter(t=>t.dueDate===k).length>3?`<div style="font-size:8px;color:#8ba49c">+${tasks.filter(t=>t.dueDate===k).length-3} lainnya</div>`:''}</div>`;}).join('')}</div>`;}
$('#page').innerHTML=heading()+`<section class="card card-pad"><div class="section-head" style="flex-wrap:wrap"><h3 class="section-title">Timeline & Deadlines</h3>${select}</div>${body}</section>`;}

const route=state.route;

async function getRows(table){return E.api('records.list',{table});}
async function loadDashboard(force=false){const d=await E.api(isStaff()?'dashboard.mentor':'dashboard.intern',{}, {dedupe:!force});state.dashboard=d;nav();return d;}
async function loadRoute(route,force=false){
 const allRoutes=(isStaff()?NAV_STAFF:NAV_INTERN).flatMap(x=>x[1]);
 if(!allRoutes.includes(route) || (!isAdmin()&&['settings','programs','criteria','members','mentorships','mentors','audit'].includes(route)))route='overview';
 const oldRoute=state.route,changed=oldRoute!==route;state.route=route;
 if(changed){state.search='';state.status='';state.sort='newest';state.page=1;state.view='table';}
 side(false);nav();
 if(route==='overview'){if(!state.dashboard)await loadDashboard(force);render();return;}
 if(route==='profile'||route==='reports'){render();return;}
 const hit=state.cache.get(route);
 if(!force&&hit&&Date.now()-hit.time<30000){state.items=hit.data;render();return;}
 $('#page').innerHTML=heading()+`<div class="skeleton"></div><div class="skeleton" style="height:240px"></div>`;
 try{
  const taskRoute=['tasks','monitoring','reviews','feedback','calendar'].includes(route);
  let result;
  if(taskRoute){const [tasks,users]=await Promise.all([E.api('tasks.list'),E.api('users.list')]);users.forEach(u=>state.userMap.set(u.id,u));result=tasks;}
  else if(route==='interns'||route==='mentors'){result=await E.api('users.list');result.forEach(u=>state.userMap.set(u.id,u));}
  else if(route==='notifications')result=await E.api('notifications.list');
  else if(route==='evaluations'||route==='performance'){const [evals,users]=await Promise.all([E.api('evaluations.list'),E.api('users.list')]);users.forEach(u=>state.userMap.set(u.id,u));result=evals;}
  else if(route==='analytics'){const resultWithUsers=await E.api('reports.performance');resultWithUsers.forEach(x=>state.userMap.set(x.user.id,x.user));result=resultWithUsers;}
  else if(route==='progress')result=await E.api('reports.intern');
  else if(TABLE[route]){result=await getRows(TABLE[route]);if(['development','daily','mentorships','members'].includes(route)){const users=await E.api('users.list');users.forEach(u=>state.userMap.set(u.id,u));}}
  else result=[];
  state.cache.set(route,{data:result,time:Date.now()});
  if(state.route!==route)return;
  state.items=result;render();
 }catch(err){if(state.route!==route)return;$('#page').innerHTML=heading()+`<div class="empty"><div class="em-icon">⚠</div><h3>Data belum dapat dimuat</h3><p>${esc(err.message)}</p><button class="btn primary" style="margin-top:17px" data-action="refresh">Coba lagi ↻</button></div>`;toast(err.message,true);}
}

function formValue(type,name,row){const value=row?.[name]??'';return typeof value==='object'?JSON.stringify(value):String(value);}
function inputHTML([name,label,type='text',required=false],row,options){const value=formValue(type,name,row);const req=required?'required':'';
 const labelHTML=`<label for="field_${esc(name)}">${esc(label)}${required?' *':''}</label>`;
 const attr=`name="${esc(name)}" id="field_${esc(name)}" ${req}`;
 if(type==='textarea')return `<div class="field wide">${labelHTML}<textarea class="textarea" ${attr} rows="3">${esc(value)}</textarea></div>`;
 if(type.startsWith('select:')){const choices=type.slice(7).split('|');return `<div class="field">${labelHTML}<select class="select" ${attr}><option value="">Pilih…</option>${choices.map(x=>`<option ${value===x?'selected':''} value="${esc(x)}">${esc(nice(x))}</option>`).join('')}</select></div>`;}
 if(type==='user'||type.startsWith('ref:')){const list=options[type]||[];return `<div class="field">${labelHTML}<select class="select" ${attr}><option value="">Pilih…</option>${list.map(x=>`<option value="${esc(x.id)}" ${value===x.id?'selected':''}>${esc(x.fullName||x.name||x.title||x.email||x.id)}</option>`).join('')}</select></div>`;}
 const t=type==='date'?'date':type==='number'?'number':type==='url'?'url':'text';
 return `<div class="field ${name==='title'||name==='name'?'wide':''}">${labelHTML}<input class="input" ${attr} type="${t}" ${type==='number'?'min="0"':''} value="${esc(value)}" placeholder="${esc(label)}" maxlength="${t==='text'?250:2000}"></div>`;
}
async function formOptions(definitions){const types=[...new Set(definitions.map(x=>x[2]).filter(x=>x==='user'||x?.startsWith('ref:')))];const result={};await Promise.all(types.map(async type=>{
  try{result[type]=type==='user'?await E.api('users.list'):await getRows(type.slice(4));}
  catch(err){result[type]=[];toast('Opsi '+type+' belum tersedia: '+err.message,true);}
 }));return result;}

 }catch(err){toast(err.message,true);closeModal();}}
async function openAssignmentForm(task){showModal('Tambah penerima tugas','<div class="skeleton"></div>','TASK ASSIGNMENT');
try{const users=await E.api('users.list');const interns=users.filter(u=>u.role==='intern');

async function openTaskDetail(assignmentId){showModal('Memuat detail tugas…','<div class="skeleton"></div>','TASK DETAIL');
try{const d=await E.api('tasks.get',{assignmentId});state.detail=d;const t=d.task;
 const row=(k,v)=>`<div class="detail-field"><dt>${esc(k)}</dt><dd>${esc(v||'—')}</dd></div>`;
 const link=x=>/^https:\/\//.test(String(x||''))?`<a style="color:#078f8b;word-break:break-all" href="${esc(x)}" target="_blank" rel="noopener noreferrer">${esc(x)}</a>`:esc(x);
 const members=isStaff()?`<div style="margin-bottom:14px">${row('Assigned intern',userName(t.internId))}</div>`:'';
 const comments=d.comments.map(c=>`<div class="activity-item"><i></i><div><b>${esc(userName(c.userId))}</b><small style="white-space:pre-wrap;line-height:1.8">${esc(c.message)}</small><small>${esc(date(c.createdAt))}</small></div></div>`).join('')||'<p class="muted">Belum ada komentar.</p>';
 const reviews=d.reviews.map(r=>`<div class="activity-item"><i></i><div><b>${esc(r.decision)} ${r.score!==''?'· '+esc(r.score)+'/100':''}</b><small style="line-height:1.8;white-space:pre-wrap">${esc(r.feedback||'Tidak ada catatan')}</small><small>${date(r.createdAt)}</small></div></div>`).join('')||'<p class="muted">Belum ada feedback.</p>';
 const submissions=d.submissions.map(s=>`<div class="activity-item"><i></i><div><b>Submission #${esc(s.version)}</b><small>${link(s.link)}</small><small>${esc(s.notes||'')} · ${date(s.createdAt)}</small></div></div>`).join('')||'<p class="muted">Belum ada submission.</p>';
 const progressForm=state.role==='intern'&&!['Completed','In Review'].includes(t.taskStatus)?`<form id="progressForm" class="inline-form" data-id="${esc(t.assignmentId)}"><h3 class="section-title">Update progress</h3><div class="form-grid"><div class="field"><label>Status</label><select class="select" name="status"><option value="In Progress" ${t.taskStatus==='In Progress'?'selected':''}>In Progress</option><option value="Blocked" ${t.taskStatus==='Blocked'?'selected':''}>Blocked</option>${t.taskStatus==='Revision Required'?'<option value="Revision Required">Revision Required</option>':''}</select></div><div class="field"><label>Progres (%)</label><input class="input" type="number" name="progress" min="0" max="100" value="${t.progress}" required></div></div><button class="btn primary small" type="submit">Simpan progress →</button></form>`:'';
 const submitForm=state.role==='intern'&&['To Do','In Progress','Revision Required','Blocked'].includes(t.taskStatus)?`<form id="submissionForm" class="inline-form" data-id="${esc(t.assignmentId)}"><h3 class="section-title">Kumpulkan pekerjaan</h3><div class="field"><label>URL hasil pekerjaan (Google Drive, Figma, GitHub, dll.)</label><input class="input" type="url" name="link" placeholder="https://..."></div><div class="field"><label>Catatan hasil pekerjaan</label><textarea class="textarea" name="notes" placeholder="Jelaskan output pekerjaan Anda…"></textarea></div><button class="btn primary" type="submit">Submit for Review →</button></form>`:'';
 const reviewForm=isStaff()&&t.taskStatus==='In Review'?`<form id="reviewForm" class="inline-form" data-id="${esc(t.assignmentId)}"><h3 class="section-title">Mentor review & approval</h3><div class="field"><label>Keputusan</label><select class="select" name="decision"><option value="approve">Approve · Completed</option><option value="revision">Request Revision</option></select></div><div class="field"><label>Feedback / alasan revisi</label><textarea class="textarea" name="feedback" placeholder="Tuliskan feedback yang membangun…"></textarea></div><div class="field"><label>Skor review (0–100, opsional)</label><input class="input" name="score" type="number" min="0" max="100" placeholder="80"></div><button class="btn primary" type="submit">Kirim keputusan →</button></form>`:'';
 const subtaskHtml=`<section style="margin-bottom:17px"><h3 class="section-title">Checklist & subtasks</h3>${t.checklist?`<div class="detail-field"><dd>${esc(t.checklist)}</dd></div>`:''}${d.subtasks.map(s=>`<label class="check-line"><input type="checkbox" data-subtask="${esc(s.id)}" ${s.done==='true'?'checked':''} ${t.taskStatus==='Completed'?'disabled':''}><span>${esc(s.title)}</span></label>`).join('')}${t.taskStatus!=='Completed'?`<form id="subtaskForm" data-id="${esc(t.assignmentId)}" class="inline-form" style="display:flex;gap:8px"><input class="input" name="title" placeholder="Tambahkan subtask…" required style="flex:1"><button class="btn small" type="submit">＋ Tambah</button></form>`:''}</section>`;
 $('#modalTitle').textContent=t.title;$('#modalLabel').textContent='TASK ASSIGNMENT · '+t.assignmentId.slice(-8);$('#modalDesc').textContent='Setiap peserta memiliki progress dan submission masing-masing.';
 $('#modalBody').innerHTML=`<div class="detail-grid"><div><div class="section-head"><h3 class="section-title">Task Information</h3>${badge(t.priority||'Medium')}</div>${row('Description',t.description)}${row('Instructions',t.instructions)}${row('Supporting links',t.links)}${row('Catatan mentor',t.notes)}${subtaskHtml}<h3 class="section-title">Submission history (${d.submissions.length})</h3>${submissions}<h3 class="section-title" style="margin-top:20px">Feedback & revisions</h3>${reviews}</div><div><div class="card" style="padding:20px;background:#fcfffd;box-shadow:none">${members}<div class="detail-field"><dt>Status</dt><dd>${badge(t.taskStatus)} ${t.isOverdue?badge('Overdue'):''}</dd></div>${row('Deadline',date(t.dueDate))}${row('Start',date(t.startDate))}${row('Progress',t.progress+'%')}<div class="progress-track" style="margin-bottom:20px"><div class="fill" style="width:${t.progress}%"></div></div>${row('Revisi',t.revisions)}${isStaff()?`<button class="btn small" data-assign="${esc(t.id)}">＋ Tambah penerima</button>`:''}</div>${progressForm}${submitForm}${reviewForm}</div></div><hr class="section-break"><h3 class="section-title">Discussion & Activity</h3>${comments}<form id="commentForm" class="inline-form" data-id="${esc(t.assignmentId)}"><div class="field"><label>Tulis komentar</label><textarea name="message" class="textarea" placeholder="Diskusi dan feedback untuk tugas ini…" required></textarea></div><button class="btn primary small" type="submit">Kirim komentar</button></form><details style="margin-top:20px"><summary style="font-weight:800;cursor:pointer">Activity history (${d.activity.length})</summary>${d.activity.map(a=>`<div class="activity-item"><i></i><div><b>${esc(nice(a.action))}</b><small>${esc(a.details)} · ${date(a.createdAt)}</small></div></div>`).join('')}</details><div class="modal-footer"><button class="btn" data-action="closeModal" type="button">Tutup</button>${isStaff()&&(isAdmin()||t.mentorId===state.user.id)?`<button class="btn" data-edit-task="${esc(t.id)}">✎ Edit tugas</button><button class="btn danger" data-archive-task="${esc(t.id)}">Arsipkan tugas</button>`:''}</div>`;
}catch(err){toast(err.message,true);closeModal();}}
async function openEvaluationForm(item=null){showModal(item?'Edit evaluasi':'Buat evaluasi','<div class="skeleton"></div>','EVALUATION & SCORING','Nilai 0–100, dengan penilaian subjektif terpisah dari metrik tugas.');
try{const users=await E.api('users.list');users.forEach(u=>state.userMap.set(u.id,u));const interns=users.filter(u=>u.role==='intern');const keys=[['quality','Quality of Work'],['timeliness','Timeliness'],['communication','Communication'],['initiative','Initiative'],['collaboration','Collaboration'],['problemSolving','Problem Solving'],['ownership','Task Ownership'],['learning','Learning Progress']];
$('#modalBody').innerHTML=`<form id="evaluationForm" data-id="${esc(item?.id||'')}"><div class="form-grid"><div class="field"><label>Peserta *</label><select class="select" name="internId" required><option value="">Pilih peserta</option>${interns.map(u=>`<option value="${esc(u.id)}" ${item?.internId===u.id?'selected':''}>${esc(u.fullName)}</option>`).join('')}</select></div><div class="field"><label>Periode *</label><input class="input" name="period" required placeholder="2026-11" value="${esc(item?.period||new Date().toISOString().slice(0,7))}"></div>${keys.map(([k,label])=>`<div class="field"><label>${esc(label)} (0–100)</label><input class="input" type="number" min="0" max="100" name="${k}" value="${esc(item?.[k]??'')}" placeholder="80"></div>`).join('')}<div class="field wide"><label>Strengths, feedback & improvement areas</label><textarea class="textarea" name="notes">${esc(item?.notes||'')}</textarea></div></div><div class="modal-footer"><button class="btn" type="button" data-action="closeModal">Batal</button><button class="btn primary" type="submit">Simpan evaluasi →</button></div></form>`;}catch(err){toast(err.message,true);closeModal();}}
function openEvaluationDetail(id){const r=state.items.find(x=>x.id===id);if(!r)return;const fields=['quality','timeliness','communication','initiative','collaboration','problemSolving','ownership','learning'];showModal('Evaluasi '+userName(r.internId),`<div class="detail-grid"><div>${fields.map(k=>`<div style="margin:0 0 16px"><div class="section-head" style="margin-bottom:8px"><strong style="font-size:11px">${esc(nice(k))}</strong><strong>${esc(r[k]||'—')}/100</strong></div><div class="progress-track"><div class="fill" style="width:${Number(r[k])||0}%"></div></div></div>`).join('')}</div><div>${[['Periode',r.period],['Mentor',userName(r.mentorId)],['Status',r.published==='true'?'Published':'Draft'],['Feedback',r.notes]].map(([k,v])=>`<div class="detail-field"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</div></div><div class="modal-footer"><button class="btn" data-action="closeModal">Tutup</button>${isStaff()?`<button class="btn" data-edit-eval="${esc(r.id)}">Edit</button>`:''}${isStaff()&&r.published!=='true'?`<button class="btn primary" data-publish="${esc(r.id)}">Publish hasil</button>`:''}</div>`,'PERFORMANCE EVALUATION','Penilaian formal, terpisah dari performa tugas terukur.');}
async function mutate(action,payload,options={}){const data=await E.api(action,payload,options);invalidate();closeModal();toast(options.successMessage||'Perubahan berhasil disimpan.');await loadRoute(state.route,true);loadDashboard(true).then(()=>{if(state.route==='overview')render();else nav();}).catch(()=>{});return data;}
async function exportFile(type){try{const result=await E.api('reports.export',{type},{timeout:50000});const blob=new Blob([result.csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=result.fileName;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast(`Berhasil mengekspor ${result.count} baris data.`);}catch(err){toast(err.message,true);}}
async function init(){if(!E.state.token){location.replace('index.html?tab=login');return;}
 try{const result=await E.api('auth.session',{}, {timeout:30000});state.user=result.user;state.role=result.user.role;E.state.user=result.user;state.userMap.set(result.user.id,result.user);await loadDashboard();await loadRoute('overview');}
 catch(err){if(!E.state.token){location.replace('index.html?tab=login');return;}$('#page').innerHTML=`<div class="empty"><div class="em-icon">⚠</div><h3>Gagal membuka workspace</h3><p>${esc(err.message)}</p><button class="btn primary" data-action="retryInit" style="margin-top:15px">Coba lagi</button><button class="btn" data-action="logout" style="margin-top:15px">Kembali ke login</button></div>`;}}
async function handleClick(e){const t=e.target.closest('button,[data-route]');if(!t)return;
 try{
  if(t.dataset.route){await loadRoute(t.dataset.route);return;}
  const a=t.dataset.action;
  if(a==='closeModal'){closeModal();return;}
  if(a==='refresh'){await refresh();return;}
  if(a==='retryInit'){await init();return;}
  if(a==='logout'){t.disabled=true;t.textContent='Keluar…';try{await E.api('auth.logout',{}, {timeout:10000});}catch(err){toast('Sesi lokal ditutup. Jika server tidak terjangkau, sesi server kedaluwarsa otomatis.',true);}E.setSession('');location.replace('index.html?tab=login');return;}
  if(a==='newTask'){await openTaskForm();return;}
  if(a==='newEvaluation'){await openEvaluationForm();return;}
  if(a==='invite'){await openInvite();return;}
  if(t.dataset.view){state.view=t.dataset.view;state.page=1;render();return;}
  if(t.dataset.page){state.page=Number(t.dataset.page);render();return;}
  if(t.dataset.add){await openRecordForm(t.dataset.add);return;}
  if(t.dataset.edit){const [table,id]=t.dataset.edit.split(':');const row=state.items.find(x=>x.id===id);await openRecordForm(table,row);return;}
  if(t.dataset.recordDetail){const [table,id]=t.dataset.recordDetail.split(':');openRecordDetail(table,id);return;}
  if(t.dataset.task){await openTaskDetail(t.dataset.task);return;}
  if(t.dataset.editTask){const item=state.items.find(x=>x.id===t.dataset.editTask)||state.detail?.task;await openTaskForm(item);return;}
  if(t.dataset.assign){const task=state.detail?.task;if(task)await openAssignmentForm(task);return;}
  if(t.dataset.user){openUserDetail(t.dataset.user);return;}
  if(t.dataset.editUser){await openUserForm(t.dataset.editUser);return;}
  if(t.dataset.eval){openEvaluationDetail(t.dataset.eval);return;}
  if(t.dataset.editEval){const item=state.items.find(x=>x.id===t.dataset.editEval);await openEvaluationForm(item);return;}
  if(t.dataset.template){const row=state.items.find(x=>x.id===t.dataset.template);await openTaskForm(null,row);return;}
  if(t.dataset.export){await exportFile(t.dataset.export);return;}
  if(t.dataset.mark){await mutate('notifications.markRead',{id:t.dataset.mark});return;}
  if(t.dataset.publish){if(!confirm('Publikasikan evaluasi ini agar terlihat oleh peserta?'))return;await mutate('evaluations.publish',{id:t.dataset.publish});return;}
  if(t.dataset.archive){if(!confirm('Arsipkan record ini? Data tidak dihapus permanen.'))return;const [table,id]=t.dataset.archive.split(':');await mutate('records.archive',{table,id});return;}
  if(t.dataset.archiveTask){if(!confirm('Arsipkan tugas dan sembunyikan dari dashboard peserta?'))return;await mutate('tasks.archive',{id:t.dataset.archiveTask});return;}
  if(t.dataset.deactivate){if(!confirm('Nonaktifkan akun ini dan cabut seluruh sesi aktifnya?'))return;await mutate('users.deactivate',{id:t.dataset.deactivate});return;}
  if(t.dataset.calPrev||t.dataset.calNext){const delta=t.dataset.calPrev?-1:1;if(state.calView==='week')state.calDate.setDate(state.calDate.getDate()+7*delta);else state.calDate.setMonth(state.calDate.getMonth()+delta);renderCalendar();return;}
  if(t.dataset.calToday){state.calDate=new Date();renderCalendar();return;}
  if(t.dataset.calView){state.calView=t.dataset.calView;renderCalendar();return;}
 }catch(err){toast(err.message||'Operasi gagal.',true);} }
async function handleSubmit(e){const form=e.target;if(!form.id)return;e.preventDefault();const submit=form.querySelector('button[type=submit]');if(submit){submit.disabled=true;submit.dataset.oldText=submit.textContent;submit.textContent='Menyimpan…';}
 const values=Object.fromEntries(new FormData(form));
 try{
  if(form.id==='taskForm'){
   if(!values.title?.trim())throw new Error('Judul tugas wajib diisi.');
   if(form.dataset.id)await mutate('tasks.update',{...values,id:form.dataset.id});
   else {values.assigneeIds=[...form.querySelectorAll('input[name="assigneeIds"]:checked')].map(el=>el.value);if(!values.assigneeIds.length)throw new Error('Pilih minimal satu peserta.');await mutate('tasks.create',values,{requestId:E.idempotencyKey()});}
  }
  else if(form.id==='assignForm'){const assigneeIds=[...form.querySelectorAll('input[name="assigneeIds"]:checked')].map(x=>x.value);await mutate('tasks.assign',{taskId:form.dataset.taskid,assigneeIds});}
  else if(form.id==='recordForm'){const id=form.dataset.id;if(form.dataset.table==='InternProfiles'&&state.role==='intern')values.userId=state.user.id;await mutate('records.save',{table:form.dataset.table,data:{...values,...(id?{id}:{})}});}
  else if(form.id==='inviteForm')await mutate('users.invite',values,{successMessage:'Undangan berhasil dikirim melalui email.'});
  else if(form.id==='userForm')await mutate('users.update',{...values,id:form.dataset.id});
  else if(form.id==='evaluationForm')await mutate(form.dataset.id?'evaluations.update':'evaluations.create',{...values,...(form.dataset.id?{id:form.dataset.id}:{})});
  else if(form.id==='progressForm')await mutate('tasks.updateProgress',{assignmentId:form.dataset.id,progress:values.progress,status:values.status});
  else if(form.id==='submissionForm'){if(!values.link&&!values.notes)throw new Error('Isi URL atau catatan hasil.');await mutate('tasks.submit',{assignmentId:form.dataset.id,...values},{requestId:E.idempotencyKey(),successMessage:'Pekerjaan dikumpulkan untuk review.'});}
  else if(form.id==='reviewForm'){if(values.decision==='revision'&&!values.feedback.trim())throw new Error('Feedback wajib untuk revisi.');await mutate(values.decision==='revision'?'tasks.requestRevision':'tasks.approve',{assignmentId:form.dataset.id,feedback:values.feedback,score:values.score});}
  else if(form.id==='commentForm')await mutate('tasks.comments',{mode:'add',assignmentId:form.dataset.id,message:values.message});
  else if(form.id==='subtaskForm')await mutate('records.save',{table:'Subtasks',data:{assignmentId:form.dataset.id,title:values.title,done:'false'}});
  else if(form.id==='profileForm'){const update=await E.api('users.update',{id:state.user.id,...values});state.user={...state.user,...update};E.state.user=state.user;toast('Profil berhasil diperbarui.');render();}
  else if(form.id==='passwordForm'){await E.api('auth.changePassword',values);form.reset();toast('Password berhasil diperbarui. Sesi perangkat lain dicabut.');}
 }catch(err){toast(err.message,true);}finally{if(submit&&submit.isConnected){submit.disabled=false;submit.textContent=submit.dataset.oldText||'Simpan';}}
}
let searchTimer;
function handleSearch(e){if(e.target.id!=='search')return;const value=e.target.value,route=state.route,caret=e.target.selectionStart;
clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(state.route!==route)return;state.search=value;state.page=1;render();const input=$('#search');if(input){input.focus();input.setSelectionRange(Math.min(caret,value.length),Math.min(caret,value.length));}},200);}
async function handleChange(e){if(e.target.id==='statusFilter'){state.status=e.target.value;state.page=1;render();}
else if(e.target.id==='sortFilter'){state.sort=e.target.value;state.page=1;render();}
else if(e.target.dataset.subtask){const id=e.target.dataset.subtask,row=state.detail?.subtasks.find(x=>x.id===id);if(!row)return;
try{await E.api('records.save',{table:'Subtasks',data:{id,assignmentId:row.assignmentId,done:String(e.target.checked)}});row.done=String(e.target.checked);invalidate();toast('Checklist diperbarui.');}catch(err){e.target.checked=!e.target.checked;toast(err.message,true);}}
}
$('#mobileMenu').addEventListener('click',()=>side(true));$('#shade').addEventListener('click',()=>side(false));$('#modalClose').addEventListener('click',closeModal);$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();side(false);}});
document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.addEventListener('input',handleSearch);document.addEventListener('change',handleChange);
window.addEventListener('edutask:unauthorized',()=>location.replace('index.html?tab=login'));
let lastActive=Date.now();
window.addEventListener('focus',()=>{if(Date.now()-lastActive>45000&&E.state.token&&state.user&&!$('#overlay').classList.contains('show')){loadDashboard(true).then(()=>loadRoute(state.route,true)).catch(()=>{});}lastActive=Date.now();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)lastActive=Date.now();});
setInterval(()=>{if(document.hidden||!state.user||!E.state.token||$('#overlay').classList.contains('show')||document.activeElement?.matches('input,textarea,select'))return;loadDashboard(true).then(()=>loadRoute(state.route,true)).catch(()=>{});},120000);
init();
})();
