<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0ca998"><title>Verifikasi Email • EduTask</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23087F8C'/%3E%3Cstop offset='1' stop-color='%2330D5C8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='17' fill='url(%23g)'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial,sans-serif' font-size='40' font-weight='800' fill='white'%3EE%3C/text%3E%3C/svg%3E">

<style>
*{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;font-family:'Plus Jakarta Sans',sans-serif;color:#16343b;background:radial-gradient(circle at 15% 17%,#d5fff1,transparent 36%),radial-gradient(circle at 90% 95%,#b8f6ed,transparent 40%),#f9fffe}.panel{max-width:510px;width:100%;padding:clamp(25px,5vw,52px);background:#ffffffee;border:1px solid #e1f2ee;border-radius:28px;box-shadow:0 24px 65px #006c6820;text-align:center}.logo{width:65px;height:65px;border-radius:20px;margin:auto auto 25px;display:grid;place-items:center;background:linear-gradient(140deg,#087f8c,#30d5c8);color:#fff;font-size:32px;box-shadow:0 14px 25px #16ae9c33}.tag{letter-spacing:2px;font-size:11px;font-weight:800;color:#0f9b91}.panel h1{font-size:30px;letter-spacing:-1px;font-weight:800;margin:14px 0}.panel p{color:#75938f;font-size:13px;line-height:1.9;margin-bottom:28px}.boxes{display:flex;justify-content:center;gap:10px;margin:28px 0}.otp{width:47px;height:57px;border-radius:13px;border:1px solid #cee9e3;text-align:center;font-size:23px;font-weight:800;color:#087f8c;background:#f9fffd;outline:0}.otp:focus{border-color:#12b8a6;box-shadow:0 0 0 3px #b6ede5}.primary{border:0;background:linear-gradient(115deg,#087f8c,#12b8a6);padding:16px;border-radius:13px;color:white;width:100%;font-weight:800;cursor:pointer;box-shadow:0 10px 22px #12b8a62f}.primary:disabled{opacity:.6;cursor:wait}.small{margin-top:21px;font-size:12px;color:#8ba5a1}a,button.link{color:#087f8c;font-weight:800;text-decoration:none;border:0;background:none;cursor:pointer}.notice{display:none;margin:15px 0;padding:13px;border-radius:12px;font-size:12px;font-weight:600}.notice.show{display:block}.notice.error{background:#fff1ed;color:#9c282e}.notice.success{background:#e6fff1;color:#05754b}@media(max-width:410px){.otp{width:38px;height:51px}.boxes{gap:6px}.panel{padding:26px 18px}.panel h1{font-size:26px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="panel"><div class="logo">✧</div><div class="tag">EMAIL VERIFICATION</div><h1>Hampir selesai!</h1><p>Kami mengirimkan kode 6 digit ke <strong id="emailText">email Anda</strong>. Masukkan kode untuk mengaktifkan akun.</p><form id="form"><div class="boxes" id="otpBoxes" aria-label="Kode verifikasi enam digit"><input class="otp" maxlength="1" inputmode="numeric" aria-label="Digit 1" autocomplete="one-time-code" required><input class="otp" maxlength="1" inputmode="numeric" aria-label="Digit 2" required><input class="otp" maxlength="1" inputmode="numeric" aria-label="Digit 3" required><input class="otp" maxlength="1" inputmode="numeric" aria-label="Digit 4" required><input class="otp" maxlength="1" inputmode="numeric" aria-label="Digit 5" required><input class="otp" maxlength="1" inputmode="numeric" aria-label="Digit 6" required></div><div class="notice" id="notice" role="status" aria-live="polite"></div><button class="primary" id="submit" type="submit">Verifikasi akun →</button></form><div class="small">Belum menerima email? <button class="link" id="resend" type="button">Kirim ulang kode</button><div style="margin-top:7px" id="timer"></div></div><div class="small"><a href="index.html?tab=login">← Kembali ke login</a></div></main><script src="config.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s), inputs=[...document.querySelectorAll('.otp')];const params=new URLSearchParams(location.search),email=params.get('email')||sessionStorage.getItem('edutask_verify_email')||'';$('#emailText').textContent=email||'email Anda';let cooldown=0;function notice(msg,ok=false){const el=$('#notice');el.textContent=msg;el.className='notice show '+(ok?'success':'error');}function tick(){const remaining=Math.max(0,Math.ceil((cooldown-Date.now())/1000));$('#timer').textContent=remaining?`Kirim ulang tersedia dalam ${remaining} detik`:'Kode kedaluwarsa setelah 15 menit.';$('#resend').disabled=remaining>0;}setInterval(tick,1000);tick();inputs.forEach((input,i)=>{input.addEventListener('input',e=>{const text=e.target.value.replace(/\D/g,'');if(text.length>1){[...text.slice(0,6-i)].forEach((ch,j)=>{if(inputs[i+j])inputs[i+j].value=ch;});inputs[Math.min(5,i+text.length-1)].focus();}else{input.value=text;if(text&&i<5)inputs[i+1].focus();}});input.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!input.value&&i>0)inputs[i-1].focus();});input.addEventListener('paste',e=>{e.preventDefault();const v=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);[...v].forEach((ch,j)=>inputs[j].value=ch);inputs[Math.min(5,v.length)].focus();});});$('#form').addEventListener('submit',async e=>{e.preventDefault();const value=inputs.map(i=>i.value).join('');if(value.length!==6){notice('Masukkan 6 digit kode OTP.');return;}const btn=$('#submit');btn.disabled=true;btn.textContent='Memverifikasi…';try{await Edutask.api('auth.verifyEmail',{email,code:value});sessionStorage.removeItem('edutask_verify_email');notice('Email berhasil diverifikasi. Mengarahkan ke login…',true);setTimeout(()=>location.replace('index.html?tab=login'),1000);}catch(err){notice(err.message);}finally{btn.disabled=false;btn.textContent='Verifikasi akun →';}});$('#resend').addEventListener('click',async()=>{try{await Edutask.api('auth.resendVerification',{email});cooldown=Date.now()+60000;tick();inputs.forEach(i=>i.value='');inputs[0].focus();notice('Jika akun belum terverifikasi, kode baru telah dikirim.',true);}catch(err){notice(err.message);}});inputs[0].focus();})();
</script></body></html>
